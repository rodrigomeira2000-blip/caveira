<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROJETO CAVEIRA - Mentoria & Múltiplos Editais</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* PALETA DE CORES MILITAR / OPERACIONAL */
        :root {
            --bg-primary: #0a0d14;      
            --bg-secondary: #121620;    
            --bg-tertiary: #1a202c;     
            --text-main: #f8fafc;       
            --text-muted: #64748b;      
            --accent: #38bdf8;          
            --border: #232a3b;          
            --gold: #eab308;            
            
            --sidebar-width: 280px;
            --main-padding: 2rem;
            --card-gap: 1.25rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            letter-spacing: -0.2px;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* BARRA SUPERIOR DE CONTEXTO */
        .workspace-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
        }

        .workspace-selector-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            justify-content: space-between;
        }

        .workspace-wrapper-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-toggle-drawer {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 1.2rem;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-toggle-drawer:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .workspace-wrapper-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .versao-tag {
            font-size: 0.7rem; 
            font-weight: bold; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        /* MENU LATERAL RETRÁTIL (DRAWER) */
        .sidebar {
            position: fixed;
            top: 0;
            left: calc(-1 * var(--sidebar-width));
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            z-index: 2000;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 1.25rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            overflow-y: auto;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.5rem;
        }

        .sidebar-header h2 {
            font-size: 0.85rem;
            color: var(--text-main);
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .btn-close-sidebar {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .btn-close-sidebar:hover {
            color: #fff;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            margin-top: 0.25rem;
        }

        .select-workspace-menu {
            padding: 0.6rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: #fff;
            font-weight: 700;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
        }

        .btn-militar-sm {
            padding: 0.6rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            width: 100%;
        }
        .btn-militar-sm:hover { background: var(--border); border-color: var(--text-muted); }

        .btn-sync-cloud {
            background: #0f172a;
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .sidebar-btn {
            width: 100%;
            text-align: left;
            padding: 0.8rem 1rem;
            font-size: 0.8rem;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .sidebar-btn:hover, .sidebar-btn.active-link { color: var(--text-main); background-color: var(--bg-tertiary); border-color: var(--border); }

        /* MÁSCA DE FUNDO */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1999;
            display: none;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active {
            display: block;
        }

        /* CONTAINER PRINCIPAL */
        .container {
            flex: 1;
            max-width: 1300px;
            margin: 0 auto;
            padding: calc(65px + var(--main-padding)) var(--main-padding) var(--main-padding) var(--main-padding);
            display: flex;
            flex-direction: column;
            gap: var(--card-gap);
            width: 100%;
        }

        /* PATENTE */
        .patente-header-box { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #121620 0%, #1e2538 100%); border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: 4px; padding: 1.5rem; }
        .patente-info h3 { font-size: 1.3rem; font-weight: 900; color: var(--gold); text-transform: uppercase; }
        .patente-info p { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .patente-proximo-requisito { text-align: right; font-size: 0.75rem; font-weight: 700; line-height: 1.4; }

        /* KPI - GRID LADO A LADO */
        .kpi-container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: var(--card-gap); 
        }
        .kpi-card { 
            background-color: var(--bg-secondary); 
            border: 1px solid var(--border); 
            border-radius: 4px; 
            padding: 1.25rem 1rem; 
            display: flex; 
            flex-direction: column; 
            gap: 0.5rem; 
            text-align: center;
            align-items: center;
        }
        .kpi-card.active-border { border-color: #f97316; }
        .kpi-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .kpi-card.active-border .kpi-label { color: #f97316; }
        .kpi-value { font-size: 1.5rem; font-weight: 800; color: var(--text-main); }

        .card { background-color: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px; padding: 1.5rem; }
        .card h2 { font-size: 0.85rem; text-transform: uppercase; color: var(--text-main); margin-bottom: 1.25rem; font-weight: 800; border-left: 2px solid var(--text-muted); padding-left: 0.5rem; }

        /* FORMULÁRIOS */
        .form-militar-row { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
        .form-militar-row label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .form-militar-row input, .form-militar-row select, .form-militar-row textarea { padding: 0.7rem; background: var(--bg-primary); border: 1px solid var(--border); color: #fff; border-radius: 3px; font-size: 0.85rem; width: 100%; }
        
        .input-group-militar { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); align-items: flex-end; }
        .input-group-militar div { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 0.35rem; }
        .input-group-militar label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .input-group-militar input { padding: 0.65rem; background: var(--bg-primary); border: 1px solid var(--border); color: #fff; border-radius: 3px; }
        .btn-militar-add { padding: 0.65rem 1.25rem; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-main); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; border-radius: 3px; cursor: pointer; height: 38px; }
        .btn-militar-add:hover { background: var(--border); }

        /* TABELAS */
        .materia-table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .materia-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        .materia-table th { color: var(--text-muted); padding: 0.75rem; border-bottom: 1px solid var(--border); font-weight: 700; text-transform: uppercase; font-size: 0.7rem; }
        .materia-table td { padding: 0.85rem 0.75rem; border-bottom: 1px solid var(--border); color: var(--text-main); }
        .badge-pct { padding: 0.2rem 0.4rem; border-radius: 2px; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; background: var(--bg-tertiary); color: var(--text-main); border: 1px solid var(--border); }

        /* CRONÔMETRO */
        .timer-display { font-size: 3.5rem; font-weight: 800; text-align: center; font-family: monospace; color: var(--text-main); margin: 1rem 0; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; padding: 1rem 0; }
        .timer-controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .timer-controls button { padding: 0.75rem; border-radius: 3px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; border: none; cursor: pointer; width: 100%; }
        .btn-success { background: var(--text-main); color: var(--bg-primary); }
        .btn-danger { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }

        /* PROGRESSO BAR */
        .progress-bar-bg { width: 100%; height: 8px; background-color: var(--bg-primary); border-radius: 4px; overflow: hidden; margin-top: 6px; border: 1px solid var(--border); }
        .progress-bar-fill { width: 0%; height: 100%; background-color: var(--accent); border-radius: 4px; transition: width 0.3s; }

        /* FLASHCARDS */
        .flashcard-box { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; padding: 2.5rem 1.5rem; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; position: relative; margin-bottom: 1rem; }
        .flashcard-badge { position: absolute; top: 0.75rem; left: 0.75rem; font-size: 0.65rem; text-transform: uppercase; font-weight: 800; background: var(--bg-tertiary); padding: 3px 8px; border: 1px solid var(--border); border-radius: 2px; color: var(--text-muted); }
        .flashcard-texto { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .flashcard-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
        .btn-fc-facil { background: #16a34a; color: white; padding: 0.75rem; font-weight: bold; border: none; border-radius: 3px; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        .btn-fc-medio { background: #ca8a04; color: white; padding: 0.75rem; font-weight: bold; border: none; border-radius: 3px; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        .btn-fc-dificil { background: #dc2626; color: white; padding: 0.75rem; font-weight: bold; border: none; border-radius: 3px; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }

        /* CADERNO DE ERROS */
        .erro-card-item { background: var(--bg-primary); border: 1px solid var(--border); border-left: 4px solid #dc2626; border-radius: 0 4px 4px 0; padding: 1rem; margin-bottom: 0.75rem; }
        .erro-card-meta { font-size: 0.65rem; color: var(--text-muted); font-weight: bold; text-transform: uppercase; margin-bottom: 0.35rem; display: flex; justify-content: space-between; }
        .erro-card-enunciado { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main); }
        .erro-card-motivo { font-size: 0.8rem; background: var(--bg-secondary); border: 1px solid var(--border); padding: 0.5rem; border-radius: 3px; color: #fca5a5; }

        /* EDITAL VERTICAL */
        .checklist-item { display: flex; align-items: center; justify-content: space-between; padding: 0.65rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        .checklist-checkbox-wrapper { display: flex; align-items: center; gap: 0.75rem; }
        .checklist-checkbox { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
        .btn-delete-item { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; padding: 0 0.5rem; }
        .btn-delete-item:hover { color: #ef4444; }

        /* CONTROLE DE EXIBIÇÃO DAS ABAS */
        .aba-conteudo { display: none; }
        .aba-conteudo.aba-ativa { display: block; }

        @media (max-width: 768px) {
            :root { --main-padding: 0.85rem; --card-gap: 0.85rem; }
            .workspace-bar { padding: 0 0.75rem; height: 60px; }
            .versao-tag { display: none !important; }
            .container { padding-top: calc(60px + var(--main-padding)); }
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR DE CONTEXTO -->
    <div class="workspace-bar">
        <div class="workspace-selector-container">
            <div class="workspace-wrapper-left">
                <button class="btn-toggle-drawer" onclick="toggleSidebar()" title="Abrir Menu">☰</button>
                <div style="font-size: 0.85rem; font-weight: 900; letter-spacing: 1px; color: var(--text-main);">
                    PROJETO CAVEIRA
                </div>
            </div>
            
            <div class="workspace-wrapper-right">
                <select class="select-workspace-menu">
                    <option value="PRF">PRF</option>
                    <option value="PF">PF</option>
                    <option value="PM">PM</option>
                </select>
                <button class="btn-militar-sm btn-sync-cloud" onclick="sincronizarNuvem()">SINCRONIZAR</button>
                <span class="versao-tag">v2.0</span>
            </div>
        </div>
    </div>

    <!-- MÁSCARA E MENU LATERAL (DRAWER) -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>PAINEL DE NAVEGAÇÃO</h2>
            <button class="btn-close-sidebar" onclick="closeSidebar()">✕</button>
        </div>
        <div class="sidebar-section">
            <span class="sidebar-title">Navegação Principal</span>
            <button class="sidebar-btn active-link" onclick="mudarAba('painel', this)">🏠 PAINEL</button>
            <button class="sidebar-btn" onclick="mudarAba('tempo', this)">📊 TEMPO</button>
            <button class="sidebar-btn" onclick="mudarAba('foco', this)">⏱️ FOCO</button>
            <button class="sidebar-btn" onclick="mudarAba('edital', this)">💀 EDITAL</button>
            <button class="sidebar-btn" onclick="mudarAba('revisar', this)">📋 REVISAR</button>
            <button class="sidebar-btn" onclick="mudarAba('erros', this)">📙 ERROS</button>
            <button class="sidebar-btn" onclick="mudarAba('cards', this)">📇 CARDS</button>
        </div>
    </aside>

    <!-- CONTAINER PRINCIPAL -->
    <main class="container">

        <!-- ABA 1: PAINEL -->
        <section id="aba-painel" class="aba-conteudo aba-ativa">
            <div style="display: flex; flex-direction: column; gap: var(--card-gap);">
                
                <div class="patente-header-box">
                    <div class="patente-info">
                        <p>HIERARQUIA FUNCIONAL DO PROJETO ATIVO</p>
                        <h3>SOLDADO</h3>
                    </div>
                    <div class="patente-proximo-requisito">
                        Próxima: <span style="color: var(--accent);">Cabo</span><br>
                        <span style="color: var(--text-muted); font-size: 0.7rem;">Faltam 5.0h e 2d</span>
                    </div>
                </div>

                <div class="kpi-container">
                    <div class="kpi-card active-border">
                        <div class="kpi-label">🔥 OFENSIVA</div>
                        <div class="kpi-value">1 Dia</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">TEMPO TOTAL</div>
                        <div class="kpi-value" id="kpi-tempo-total">0h 0m</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">QUESTÕES</div>
                        <div class="kpi-value">0%</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">VARRER EDITAL</div>
                        <div class="kpi-value" id="kpi-edital-pct">0%</div>
                    </div>
                </div>

                <div class="card">
                    <h2>📅 META OPERACIONAL SEMANAL</h2>
                    <div class="form-militar-row">
                        <label>META DE HORAS</label>
                        <input type="text" value="20 Horas" readonly>
                    </div>
                    <div style="margin-top: 1rem;">
                        <div style="display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: bold; text-transform: uppercase;">
                            <span>PROGRESSO SEMANAL</span>
                            <span id="meta-texto-progresso">0.0H / 20H</span>
                        </div>
